<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1442" width="800" height="1442" font-family="Helvetica, Arial, sans-serif"><defs><marker id="aD" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.8 L9,5 L0.5,9.2 Z" fill="#444444"/></marker><marker id="aM" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.8 L9,5 L0.5,9.2 Z" fill="#6E8091"/></marker></defs><rect width="800" height="1442" fill="#FFFFFF"/><text x="400.0" y="54" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#111111" font-style="normal">Frequency Branch of SpecGate-Net</text><rect x="230.0" y="96" width="340" height="80" rx="10" ry="10" fill="#F2F2F2" stroke="#6B6B6B" stroke-width="1.6"/><text x="400.0" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1c1c1c" font-style="normal">Input Feature</text><text x="400.0" y="158" text-anchor="middle" font-family="'Courier New', monospace" font-size="23" font-weight="400" fill="#555555" font-style="normal">x  (B x C x H x W)</text><line x1="400.0" y1="176" x2="400.0" y2="216" stroke="#444444" stroke-width="2.2" marker-end="url(#aD)"/><rect x="230.0" y="216" width="340" height="80" rx="10" ry="10" fill="#F2F2F2" stroke="#6B6B6B" stroke-width="1.6"/><text x="400.0" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1c1c1c" font-style="normal">Cast to FP32</text><text x="400.0" y="278" text-anchor="middle" font-family="'Courier New', monospace" font-size="23" font-weight="400" fill="#555555" font-style="normal">x.float()</text><line x1="400.0" y1="296" x2="400.0" y2="336" stroke="#444444" stroke-width="2.2" marker-end="url(#aD)"/><text x="590.0" y="304.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#7a7a7a" font-style="italic">single precision</text><text x="590.0" y="328.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#7a7a7a" font-style="italic">(AMP-stable)</text><rect x="230.0" y="336" width="340" height="80" rx="10" ry="10" fill="#FBEEE0" stroke="#C6803A" stroke-width="1.6"/><text x="400.0" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1c1c1c" font-style="normal">2D Real FFT</text><text x="400.0" y="398" text-anchor="middle" font-family="'Courier New', monospace" font-size="23" font-weight="400" fill="#555555" font-style="normal">rfft2 (norm=ortho)</text><line x1="400.0" y1="416" x2="400.0" y2="456" stroke="#444444" stroke-width="2.2" marker-end="url(#aD)"/><text x="590.0" y="412.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#7a7a7a" font-style="italic">complex spectrum</text><text x="590.0" y="436.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#7a7a7a" font-style="italic">B x C x H x</text><text x="590.0" y="460.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#7a7a7a" font-style="italic">(W//2 + 1)</text><rect x="230.0" y="456" width="340" height="80" rx="10" ry="10" fill="#F6E1C8" stroke="#B06A2C" stroke-width="1.6"/><text x="400.0" y="490" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1c1c1c" font-style="normal">High-pass Filter</text><text x="400.0" y="518" text-anchor="middle" font-family="'Courier New', monospace" font-size="23" font-weight="400" fill="#555555" font-style="normal">spectrum ⊙ mask</text><line x1="400.0" y1="536" x2="400.0" y2="576" stroke="#444444" stroke-width="2.2" marker-end="url(#aD)"/><text x="590.0" y="556.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#7a7a7a" font-style="italic">filtered spectrum</text><rect x="230.0" y="576" width="340" height="80" rx="10" ry="10" fill="#FBEEE0" stroke="#C6803A" stroke-width="1.6"/><text x="400.0" y="610" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1c1c1c" font-style="normal">2D Inverse FFT</text><text x="400.0" y="638" text-anchor="middle" font-family="'Courier New', monospace" font-size="23" font-weight="400" fill="#555555" font-style="normal">irfft2 (s=(H,W), ortho)</text><line x1="400.0" y1="656" x2="400.0" y2="696" stroke="#444444" stroke-width="2.2" marker-end="url(#aD)"/><text x="590.0" y="676.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#7a7a7a" font-style="italic">real, B x C x H x W</text><rect x="230.0" y="696" width="340" height="80" rx="10" ry="10" fill="#F2F2F2" stroke="#6B6B6B" stroke-width="1.6"/><text x="400.0" y="730" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1c1c1c" font-style="normal">Cast to dtype</text><text x="400.0" y="758" text-anchor="middle" font-family="'Courier New', monospace" font-size="23" font-weight="400" fill="#555555" font-style="normal">out.to(x.dtype)</text><line x1="400.0" y1="776" x2="400.0" y2="816" stroke="#444444" stroke-width="2.2" marker-end="url(#aD)"/><rect x="230.0" y="816" width="340" height="80" rx="10" ry="10" fill="#F3D9BE" stroke="#B06A2C" stroke-width="1.6"/><text x="400.0" y="850" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1c1c1c" font-style="normal">Freq. Feature</text><text x="400.0" y="878" text-anchor="middle" font-family="'Courier New', monospace" font-size="23" font-weight="400" fill="#555555" font-style="normal">(B x C x H x W)</text><rect x="190.0" y="950" width="420" height="322" rx="14" ry="14" fill="#FAFBFC" stroke="#7C93A8" stroke-width="1.6" stroke-dasharray="5,4"/><text x="400.0" y="980" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#4f6472" font-style="normal">Fixed radial high-pass mask</text><text x="400.0" y="1002" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#4f6472" font-style="normal">non-learnable, cached per (H, W, device)</text><rect x="245.0" y="1024" width="310" height="46" rx="8" ry="8" fill="#EEF2F6" stroke="#7C93A8" stroke-width="1.5"/><text x="400.0" y="1044" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1c1c1c" font-style="normal">Frequency Grid</text><text x="400.0" y="1061" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="400" fill="#555555" font-style="normal">fftfreq(H), rfftfreq(W)</text><line x1="400.0" y1="1070" x2="400.0" y2="1094" stroke="#6E8091" stroke-width="1.8" marker-end="url(#aM)"/><rect x="245.0" y="1094" width="310" height="46" rx="8" ry="8" fill="#EEF2F6" stroke="#7C93A8" stroke-width="1.5"/><text x="400.0" y="1114" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1c1c1c" font-style="normal">Radial Frequency</text><text x="400.0" y="1131" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="400" fill="#555555" font-style="normal">r = √(fᵧ² + fₓ²)</text><line x1="400.0" y1="1140" x2="400.0" y2="1164" stroke="#6E8091" stroke-width="1.8" marker-end="url(#aM)"/><rect x="245.0" y="1164" width="310" height="46" rx="8" ry="8" fill="#EEF2F6" stroke="#7C93A8" stroke-width="1.5"/><text x="400.0" y="1184" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1c1c1c" font-style="normal">Binary High-pass</text><text x="400.0" y="1201" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="400" fill="#555555" font-style="normal">mask = (r ≥ cutoff)</text><text x="400.0" y="1246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#4f6472" font-style="normal">cutoff = 0.1  (fixed hyperparameter)</text><polyline points="190.0,1111.0 184.0,1111.0 184.0,496.0 230.0,496.0" fill="none" stroke="#6E8091" stroke-width="2.0" marker-end="url(#aM)"/><text x="169.0" y="803.5" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#6E8091" font-style="italic">mask</text><text x="30" y="1316" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#555" font-style="normal">Parameter-free module (no learnable weights).</text><text x="30" y="1342" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#666" font-style="normal">Output spatial resolution equals input (H x W).  Both transforms use</text><text x="30" y="1366" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#666" font-style="normal">norm = 'ortho'.  The spectrum itself is not passed through abs()/magnitude.</text><line x1="97" y1="1407" x2="137" y2="1407" stroke="#444444" stroke-width="2.2" marker-end="url(#aD)"/><text x="147" y="1412" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#555" font-style="normal">data path</text><line x1="367" y1="1407" x2="407" y2="1407" stroke="#6E8091" stroke-width="1.8" marker-end="url(#aM)"/><text x="417" y="1412" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#555" font-style="normal">fixed mask (non-learnable)</text></svg>