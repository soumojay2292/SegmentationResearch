 stroke="#444" stroke-width="1.9"/><polyline points="824.0,726 803.0,726" fill="none" stroke="#444" stroke-width="1.9" marker-end="url(#a)"/><polyline points="824.0,430 680.0,430 680.0,452" fill="none" stroke="#444" stroke-width="1.9" marker-end="url(#a)"/><text x="950" y="383.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#B06A2C" font-style="italic">F_f</text><polyline points="620.0,650 620.0,668" fill="none" stroke="#444" stroke-width="1.9"/><polyline points="620.0,668 458.0,668 458.0,705" fill="none" stroke="#444" stroke-width="1.9" marker-end="url(#a)"/><text x="467.0" y="661" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#6C46A6" font-style="italic">g</text><polyline points="620.0,668 746.0,668" fill="none" stroke="#444" stroke-width="1.9"/><polyline points="782.0,674 782.0,705" fill="none" stroke="#444" stroke-width="1.9" marker-end="url(#a)"/><polyline points="458.0,747 458.0,814 598.0,814" fill="none" stroke="#444" stroke-width="1.9" marker-end="url(#a)"/><polyline points="782.0,747 782.0,814 642.0,814" fill="none" stroke="#444" stroke-width="1.9" marker-end="url(#a)"/><rect x="40" y="958" width="1160" height="94" rx="10" ry="10" fill="#FCFCFC" stroke="#DADADA" stroke-width="1.1"/><text x="60" y="989" text-anchor="start" font-family="'Courier New', monospace" font-size="18" font-weight="400" fill="#333" font-style="normal">Gate:  g = σ( 1x1 Conv( [ F_s || F_f ] ) )        Fusion:  F_fused = g ⊙ F_s + (1 − g) ⊙ F_f</text><text x="60" y="1016" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#444" font-style="normal">*  learnable (trainable parameters).  InstanceNorm2d uses affine=False (parameter-free);</text><text x="60" y="1037" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#444" font-style="normal">ReLU, Sigmoid, concatenation, ⊙ (element-wise multiply) and ⊕ (element-wise add) are parameter-free.</text><rect x="40" y="1081" width="19" height="16" rx="3" ry="3" fill="#DDEEE1" stroke="#3f7c50" stroke-width="1.2"/><text x="67" y="1094" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#555" font-style="normal">Spatial path</text><rect x="214.60000000000002" y="1081" width="19" height="16" rx="3" ry="3" fill="#F7E6D2" stroke="#B06A2C" stroke-width="1.2"/><text x="241.60000000000002" y="1094" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#555" font-style="normal">Frequency path</text><rect x="406.80000000000007" y="1081" width="19" height="16" rx="3" ry="3" fill="#EDE8F3" stroke="#7A5BA6" stroke-width="1.2"/><text x="433.80000000000007" y="1094" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#555" font-style="normal">Gated Fusion</text><text x="581.4000000000001" y="1094" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#555" font-style="normal">⊙  element-wise multiply     ⊕  element-wise add     [ · || · ]  channel concatenation</text></svg>